{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="management-section">
  <h1>{% if form.instance.pk %}Şagirdi Düzəliş Et{% else %}Yeni Şagird{% endif %}</h1>
  <form method="post" class="management-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Yadda saxla</button>
    <a href="{% url 'student_list' %}">Geri</a>
  </form>
</section>
{% endblock %}

{% block js %}
<script src="{% static '../static/js/main.js' %}"></script>
{% endblock %}
